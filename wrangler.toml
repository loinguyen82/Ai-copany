name = "ai-copany"
main = "src/index.js"
compatibility_date = "2026-08-29"

[vars]
AI_BASE_URL = "https://api.apivn.tech/v1"
AI_MODEL = "claude-fable-5"
META_GRAPH_VERSION = "v26.0"
AUTO_PUBLISH_FACEBOOK = "false"
CONTENT_DUPLICATE_THRESHOLD = "0.72"

# Wrangler automatically provisions D1 on first deploy and keeps the binding linked.
[[d1_databases]]
binding = "DB"
